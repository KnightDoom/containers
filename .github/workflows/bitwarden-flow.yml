name: Build and Push Bitwarden CLI Image
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate date-based version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG="$(date -u +'%Y.%V.%u')"

          # Fetch existing tags for this package from GHCR, count how many
          # already start with today's date tag
          EXISTING_COUNT=$(gh api \
            --paginate \
            "/user/packages/container/bitwarden-cli/versions" \
            --jq '[.[].metadata.container.tags[]? | select(startswith("'"$DATE_TAG"'"))] | length' \
            2>/dev/null || echo 0)

          POINT=$((EXISTING_COUNT))
          FULL_TAG="${DATE_TAG}.${POINT}"

          echo "tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${FULL_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Bitwarden CLI image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./apps/bitwarden-cli
          file: ./apps/bitwarden-cli/Dockerfile
          push: true
          tags: |
            ghcr.io/knightdoom/bitwarden-cli:latest
            ghcr.io/knightdoom/bitwarden-cli:${{ steps.version.outputs.tag }}
